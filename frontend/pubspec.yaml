name: campusfind

description: AI-Powered College Lost & Found System

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  go_router: ^14.0.0
  intl: ^0.19.0

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

  image_picker: ^1.2.3

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true